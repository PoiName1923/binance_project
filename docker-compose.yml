# Nguyên tắc xây dựng instance cho đẹp:
# image, hostname, container_name, depends_on, restart, ports, environment, env_file,healthcheck, volumes, networks
services:
# ===========================================================================================================================================================
# =================================================================== CLICKHOUSE CONFIG =====================================================================
# ===========================================================================================================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "9002:9000"     # Native TCP interface
      - "8123:8123"     # HTTP interface
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-trading}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      TZ: Asia/Ho_Chi_Minh
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./logs/clickhouse:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    mem_limit: 3g
    cpus: 1.5
    networks:
      - project-network
# ============================================================================================================================  
  clickhouse-init:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./src/consumer/jobs/init_clickhouse.sql:/init_clickhouse.sql:ro
    entrypoint: /bin/bash
    command: -lc "clickhouse-client --host ${CLICKHOUSE_HOST} --port ${CLICKHOUSE_TCP_PORT} --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} < /init_clickhouse.sql"
    networks:
      - project-network
      
# ============================================================================================================================  
  clickhouse-ui:
    image: spoonest/clickhouse-tabix-web-client:latest
    container_name: clickhouse-ui
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CH_HOST: clickhouse
      CH_LOGIN: ${CLICKHOUSE_USER:-default}
      CH_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CH_PORT: 8123
    ports:
      - "8086:80"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    networks:
      - project-network
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/localhost/80' "]
      interval: 10s
      timeout: 10s
      retries: 12

# ===========================================================================================================================================================
# ================================================================ KAFKA CONFIG ============================================================================
# ===========================================================================================================================================================
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9093:9093"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092,CONTROLLER://kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CLUSTER_ID: "BinAnceTraKIng"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_NODE_ID: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - ./data/kafka-data:/var/lib/kafka/data
      - ./logs/kafka-logs:/opt/kafka/logs
    mem_limit: 2g
    networks:
      - project-network
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/localhost/9092' "]
      interval: 10s
      timeout: 10s
      retries: 12

# ============================================================================================================================
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./scripts/init/kafka_topic_init.sh:/kafka_topic_init.sh:ro
    entrypoint: ["bash", "/kafka_topic_init.sh"]
    networks:
      - project-network

# ============================================================================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_NAME: local
    mem_limit: 256m
    networks:
      - project-network
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/localhost/8080' "]
      interval: 15s
      timeout: 10s
      retries: 20

# ===========================================================================================================================================================
# ====================================================================== DATA SCRAPING ======================================================================
# ===========================================================================================================================================================
  producer-1:
    build:
      context: ./src/producer/.
      dockerfile: Dockerfile
    container_name: producer-1
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      SYMBOL_FILE_DIR: /app/symbols_1.txt
    mem_limit: 64m
    networks:
      - project-network

# ============================================================================================================================  
  producer-2:
    build:
      context: ./src/producer/.
      dockerfile: Dockerfile
    container_name: producer-2
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      SYMBOL_FILE_DIR: /app/symbols_2.txt
    mem_limit: 64m
    networks:
      - project-network
# ===========================================================================================================================================================
# ===================================================================== FLINK CONFIG ========================================================================
# ===========================================================================================================================================================
  jobmanager:
    build:
      context: ./src/consumer/.
      dockerfile: Dockerfile
    container_name: flink-jobmanager
    hostname: jobmanager
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./src/consumer:/opt/flink/jobs/consumer
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        rest.port: 8081
        execution.checkpointing.checkpoint-storage: filesystem
        state.checkpoints.dir: s3a://${MINIO_BUCKET}/flink/checkpoints
        state.savepoints.dir: s3a://${MINIO_BUCKET}/flink/savepoints
        fs.s3a.endpoint: http://${MINIO_HOST}:${MINIO_PORT}
        fs.s3a.access.key: ${MINIO_ROOT_USER}
        fs.s3a.secret.key: ${MINIO_ROOT_PASSWORD}
        fs.s3a.path.style.access: true
        fs.s3a.connection.ssl.enabled: false
        fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    command: jobmanager
    networks:
      - project-network
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/localhost/8081' "]
      interval: 10s
      timeout: 10s
      retries: 20

# ==============================================================================================================================
  taskmanager:
    build:
      context: ./src/consumer/.
      dockerfile: Dockerfile
    container_name: flink-taskmanager
    hostname: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./src/consumer:/opt/flink/jobs/consumer
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        execution.checkpointing.checkpoint-storage: filesystem
        state.checkpoints.dir: s3a://${MINIO_BUCKET}/flink/checkpoints
        state.savepoints.dir: s3a://${MINIO_BUCKET}/flink/savepoints
        fs.s3a.endpoint: http://${MINIO_HOST}:${MINIO_PORT}
        fs.s3a.access.key: ${MINIO_ROOT_USER}
        fs.s3a.secret.key: ${MINIO_ROOT_PASSWORD}
        fs.s3a.path.style.access: true
        fs.s3a.connection.ssl.enabled: false
        fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    command: taskmanager
    networks:
      - project-network

# ==============================================================================================================================
  flink-consumer:
    build:
      context: ./src/consumer/.
      dockerfile: Dockerfile
    container_name: flink-consumer
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        parallelism.default: 2
        execution.checkpointing.checkpoint-storage: filesystem
        state.checkpoints.dir: s3a://${MINIO_BUCKET}/flink/checkpoints
        state.savepoints.dir: s3a://${MINIO_BUCKET}/flink/savepoints
        fs.s3a.endpoint: http://${MINIO_HOST}:${MINIO_PORT}
        fs.s3a.access.key: ${MINIO_ROOT_USER}
        fs.s3a.secret.key: ${MINIO_ROOT_PASSWORD}
        fs.s3a.path.style.access: true
        fs.s3a.connection.ssl.enabled: false
        fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    volumes:
      - ./src/consumer:/opt/flink/jobs/consumer
    command: flink run -m jobmanager:8081 -py /opt/flink/jobs/consumer/jobs/main.py
    networks:
      - project-network
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/jobmanager/8081' "]
      interval: 15s
      timeout: 10s
      retries: 20

# ======================================================================================================================================================
# =======================================================================  MINIO CONFIG  ===============================================================
# ======================================================================================================================================================
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    hostname: minio
    container_name: minio
    ports:
      - "9000:9000"
      - "8084:9001"
    environment:
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_OPTS: "--compat"
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio_data:/data
    mem_limit: 400m
    networks:
      - project-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

# ============================================================================================================================  
  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./scripts/init/minio_bucket_init.sh:/minio_bucket_init.sh:ro
    entrypoint: ["/bin/sh", "/minio_bucket_init.sh"]
    networks:
      - project-network

# ======================================================================================================================================================
# ======================================================================================================================================================
networks:
  project-network:
    driver: bridge
volumes:
  data:
