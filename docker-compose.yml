# Nguyên tắc xây dựng instance cho đẹp:
# image, hostname, container_name, depends_on, restart, ports, environment, env_file,healthcheck, volumes, networks
services:
# ===========================================================================================================================================================
# =================================================================== CLICKHOUSE CONFIG =====================================================================
# ===========================================================================================================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "9002:9000"     # Native TCP interface
      - "8123:8123"     # HTTP interface
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-trading}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      TZ: Asia/Ho_Chi_Minh
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    mem_limit: 2g
    cpus: 1.0
    networks:
      - project-network
# ============================================================================================================================  
  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./scripts/init/init_clickhouse.sql:/init_clickhouse.sql:ro
    entrypoint: /bin/bash
    command: -lc "clickhouse-client -n --host ${CLICKHOUSE_HOST} --port ${CLICKHOUSE_TCP_PORT} --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} < /init_clickhouse.sql"
    networks:
      - project-network

# ===========================================================================================================================================================
# ================================================================ KAFKA CONFIG ============================================================================
# ===========================================================================================================================================================
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9093:9093"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092,CONTROLLER://kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CLUSTER_ID: "BinanceTracking"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_NODE_ID: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_LOG_RETENTION_HOURS: 3
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    cpus: 0.75
    networks:
      - project-network
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/localhost/9092' "]
      interval: 10s
      timeout: 10s
      retries: 12

# ============================================================================================================================
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./scripts/init/kafka_topic_init.sh:/kafka_topic_init.sh:ro
    entrypoint: ["bash", "/kafka_topic_init.sh"]
    networks:
      - project-network

# ===========================================================================================================================================================
# ====================================================================== DATA SCRAPING ======================================================================
# ===========================================================================================================================================================
  producer-1:
    build:
      context: ./datasourcs/producer/.
      dockerfile: Dockerfile
    container_name: producer-1
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      SYMBOL_FILE_DIR: /app/symbols_1.txt
    mem_limit: 64m
    networks:
      - project-network

# ============================================================================================================================  
  producer-2:
    build:
      context: ./datasourcs/producer/.
      dockerfile: Dockerfile
    container_name: producer-2
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      SYMBOL_FILE_DIR: /app/symbols_2.txt
    mem_limit: 64m
    networks:
      - project-network
# ===========================================================================================================================================================
# ===================================================================== FLINK CONFIG ========================================================================
# ===========================================================================================================================================================
  jobmanager:
    build:
      context: ./datasourcs/consumer/.
      dockerfile: Dockerfile
    container_name: flink-jobmanager
    hostname: jobmanager
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SINK_TARGET: ${SINK_TARGET:-clickhouse}
    command: >
      bash -lc "envsubst < /opt/flink/custom-conf/flink-conf.yaml.template > /opt/flink/conf/flink-conf.yaml && exec /docker-entrypoint.sh jobmanager"
    mem_limit: 1024m
    cpus: 0.75
    networks:
      - project-network

# ==============================================================================================================================
  taskmanager:
    build:
      context: ./datasourcs/consumer/.
      dockerfile: Dockerfile
    container_name: flink-taskmanager
    hostname: taskmanager
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SINK_TARGET: ${SINK_TARGET:-clickhouse}
    command: >
      bash -lc "envsubst < /opt/flink/custom-conf/flink-conf.yaml.template > /opt/flink/conf/flink-conf.yaml && exec /docker-entrypoint.sh taskmanager"
    mem_limit: 4096m
    cpus: 2.0
    networks:
      - project-network

  # ==============================================================================================================================
  flink-submit:
    build:
      context: ./datasourcs/consumer/.
      dockerfile: Dockerfile
    container_name: flink-submit
    depends_on:
      - jobmanager
      - taskmanager
    env_file:
      - .env
    environment:
      SINK_TARGET: ${SINK_TARGET:-clickhouse}
    command: >
      bash -lc "envsubst < /opt/flink/custom-conf/flink-conf.yaml.template > /opt/flink/conf/flink-conf.yaml && until curl -s http://jobmanager:8081/overview | grep -E '\"slots-total\":[1-9]'; do echo '[flink-submit] waiting for TaskManagers...'; sleep 3; done; flink run -d -m jobmanager:8081 -py /opt/flink/jobs/main.py --pyFiles /opt/flink/jobs"
    mem_limit: 256m
    cpus: 0.25
    networks:
      - project-network

# ======================================================================================================================================================
# =======================================================================  MINIO CONFIG  ===============================================================
# ======================================================================================================================================================
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    hostname: minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "8084:9001"
    environment:
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_OPTS: "--compat"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    mem_limit: 1024m
    cpus: 1
    networks:
      - project-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

# ============================================================================================================================  
  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./scripts/init/minio_bucket_init.sh:/minio_bucket_init.sh:ro
    entrypoint: ["/bin/sh", "/minio_bucket_init.sh"]
    networks:
      - project-network
# ======================================================================================================================================================
# =======================================================================  GRAFANA CONFIG  ==============================================================
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3001:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: "dark"
      GF_DEFAULT_INSTANCE_NAME: "Binance_Tracking"
      TZ: Asia/Ho_Chi_Minh
    mem_limit: 256m
    cpus: 0.25
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - project-network
# ======================================================================================================================================================
# ======================================================================================================================================================
networks:
  project-network:
    driver: bridge
volumes:
  clickhouse-data:
  kafka-data:
  minio-data:
  grafana-storage:
