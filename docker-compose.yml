# Nguyên tắc xây dựng instance cho đẹp:
# image, hostname, container_name, depends_on, restart, ports, environment, env_file,healthcheck, volumes, networks
services:
# ===========================================================================================================================================================
# =================================================================== CLICKHOUSE CONFIG =====================================================================
# ===========================================================================================================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "9002:9000"     # Native TCP interface
      - "8123:8123"     # HTTP interface
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-trading}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      TZ: Asia/Ho_Chi_Minh
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    mem_limit: 3g
    cpus: 1.5
    networks:
      - project-network
# ============================================================================================================================  
  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./scripts/init/init_clickhouse.sql:/init_clickhouse.sql:ro
    entrypoint: /bin/bash
    command: -lc "clickhouse-client -n --host ${CLICKHOUSE_HOST} --port ${CLICKHOUSE_TCP_PORT} --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} < /init_clickhouse.sql"
    networks:
      - project-network

# ============================================================================================================================  
  ch-ui:
    image: ghcr.io/duyet/clickhouse-monitoring:456ad9c
    container_name: clickhouse-ui
    restart: always
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      CLICKHOUSE_HOST: http://${CLICKHOUSE_HOST}:${CLICKHOUSE_HTTP_PORT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_TZ: Asia/Ho_Chi_Minh
      CLICKHOUSE_MAX_EXECUTION_TIME: 15
      NEXT_QUERY_CACHE_TTL: 86400
    mem_limit: 512m
    cpus: 0.5
    networks:
      - project-network
# ===========================================================================================================================================================
# ================================================================ KAFKA CONFIG ============================================================================
# ===========================================================================================================================================================
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9093:9093"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092,CONTROLLER://kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CLUSTER_ID: "BinanceTracking"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_NODE_ID: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_LOG_RETENTION_HOURS: 3
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 2g
    cpus: 1
    networks:
      - project-network
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/localhost/9092' "]
      interval: 10s
      timeout: 10s
      retries: 12

# ============================================================================================================================
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./scripts/init/kafka_topic_init.sh:/kafka_topic_init.sh:ro
    entrypoint: ["bash", "/kafka_topic_init.sh"]
    networks:
      - project-network

# ============================================================================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_NAME: local
    mem_limit: 256m
    networks:
      - project-network

# ===========================================================================================================================================================
# ====================================================================== DATA SCRAPING ======================================================================
# ===========================================================================================================================================================
  producer-1:
    build:
      context: ./src/producer/.
      dockerfile: Dockerfile
    container_name: producer-1
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      SYMBOL_FILE_DIR: /app/symbols_1.txt
    mem_limit: 64m
    networks:
      - project-network

# ============================================================================================================================  
  producer-2:
    build:
      context: ./src/producer/.
      dockerfile: Dockerfile
    container_name: producer-2
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      SYMBOL_FILE_DIR: /app/symbols_2.txt
    mem_limit: 64m
    networks:
      - project-network
# ===========================================================================================================================================================
# ===================================================================== FLINK CONFIG ========================================================================
# ===========================================================================================================================================================
  jobmanager:
    build:
      context: ./src/consumer/.
      dockerfile: Dockerfile
    container_name: flink-jobmanager
    hostname: jobmanager
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
        jobmanager.memory.jvm-overhead.min: 160m
        jobmanager.memory.jvm-overhead.max: 256m
        taskmanager.memory.process.size: 1792m
        taskmanager.memory.managed.fraction: 0.2
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        rest.port: 8081
        restart-strategy: failure-rate
        restart-strategy.failure-rate.max-failures-per-interval: 10
        restart-strategy.failure-rate.failure-rate-interval: 5 min
        restart-strategy.failure-rate.delay: 10 s
        execution.checkpointing.interval: 30 s
        execution.checkpointing.min-pause: 10 s
        execution.checkpointing.timeout: 3 min
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.checkpoint-storage: filesystem
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.tolerable-failed-checkpoints: 3
        execution.checkpointing.unaligned: true
        table.exec.mini-batch.enabled: true
        table.exec.mini-batch.allow-latency: 2 s
        table.exec.mini-batch.size: 5000
        table.exec.source.idle-timeout: 30 s
        state.checkpoints.dir: s3a://${MINIO_BUCKET}/flink/checkpoints
        state.savepoints.dir: s3a://${MINIO_BUCKET}/flink/savepoints
        fs.s3a.endpoint: http://${MINIO_HOST}:${MINIO_PORT}
        fs.s3a.access.key: ${MINIO_ROOT_USER}
        fs.s3a.secret.key: ${MINIO_ROOT_PASSWORD}
        fs.s3a.path.style.access: true
        fs.s3a.connection.ssl.enabled: false
        fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    command: jobmanager
    mem_limit: 1536m
    cpus: 1
    networks:
      - project-network

# ==============================================================================================================================
  taskmanager:
    build:
      context: ./src/consumer/.
      dockerfile: Dockerfile
    container_name: flink-taskmanager
    hostname: taskmanager
    restart: unless-stopped
    depends_on:
      jobmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.jvm-overhead.min: 160m
        jobmanager.memory.jvm-overhead.max: 256m

        taskmanager.memory.process.size: 1792m
        taskmanager.memory.managed.fraction: 0.2
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        restart-strategy: failure-rate
        restart-strategy.failure-rate.max-failures-per-interval: 3
        restart-strategy.failure-rate.failure-rate-interval: 5 min
        restart-strategy.failure-rate.delay: 10 s
        execution.checkpointing.interval: 30 s
        execution.checkpointing.min-pause: 10 s
        execution.checkpointing.timeout: 3 min
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.checkpoint-storage: filesystem
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.tolerable-failed-checkpoints: 3
        execution.checkpointing.unaligned: true
        table.exec.mini-batch.enabled: true
        table.exec.mini-batch.allow-latency: 2 s
        table.exec.mini-batch.size: 5000
        table.exec.source.idle-timeout: 30 s
        state.checkpoints.dir: s3a://${MINIO_BUCKET}/flink/checkpoints
        state.savepoints.dir: s3a://${MINIO_BUCKET}/flink/savepoints
        fs.s3a.endpoint: http://${MINIO_HOST}:${MINIO_PORT}
        fs.s3a.access.key: ${MINIO_ROOT_USER}
        fs.s3a.secret.key: ${MINIO_ROOT_PASSWORD}
        fs.s3a.path.style.access: true
        fs.s3a.connection.ssl.enabled: false
        fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
    command: taskmanager
    mem_limit: 2g
    cpus: 1.25
    networks:
      - project-network

# ======================================================================================================================================================
# =======================================================================  MINIO CONFIG  ===============================================================
# ======================================================================================================================================================
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    hostname: minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "8084:9001"
    environment:
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_OPTS: "--compat"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    mem_limit: 400m
    cpus: 0.5
    networks:
      - project-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

# ============================================================================================================================  
  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./scripts/init/minio_bucket_init.sh:/minio_bucket_init.sh:ro
    entrypoint: ["/bin/sh", "/minio_bucket_init.sh"]
    networks:
      - project-network
# ======================================================================================================================================================
# =======================================================================  GRAFANA CONFIG  ==============================================================
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - 3001:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: "dark"
      GF_DEFAULT_INSTANCE_NAME: "Binance_Tracking"
      TZ: Asia/Ho_Chi_Minh
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - project-network
# ======================================================================================================================================================
# ======================================================================================================================================================
networks:
  project-network:
    driver: bridge
volumes:
  clickhouse-data:
  kafka-data:
  minio-data:
  grafana-storage:
